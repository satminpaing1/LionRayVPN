name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Xray core version as an AndroidLibXrayLite release tag (e.g. v26.8.20)'
        required: true
        type: string
      app_version:
        description: 'APP version (e.g. 1.1, 1.2)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-36"

      # The Xray core runs IN-PROCESS via libgojni, which is compiled into the
      # prebuilt libv2ray.aar. AndroidLibXrayLite publishes one AAR per Xray-core
      # version, so downloading the AAR for the chosen tag is what actually
      # updates the core that ships inside the APK.
      - name: Download libv2ray for chosen Xray version
        run: |
          TAG="${{ github.event.inputs.xray_version }}"
          echo "Downloading libv2ray.aar for ${TAG}..."
          curl -fL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"
          ls -la app/libs/libv2ray.aar

      # The AndroidLibXrayLite release TAG does NOT reliably match the actual
      # Xray-core version compiled into the binary (the v26.8.20 tag, for
      # example, still shipped v26.3.27 internally). The source of truth is the
      # Go module pseudo-version baked into libgojni.so, e.g.:
      #   dep  github.com/xtls/xray-core  v1.260327.1-0.20260728075948-...  h1:...
      # Extract that, and derive the friendly version (v1.YYMMDD.x => vYY.MM.DD).
      - name: Detect real Xray core version
        id: corever
        run: |
          set -e
          mkdir -p /tmp/aar && unzip -o -q app/libs/libv2ray.aar -d /tmp/aar
          SO=$(find /tmp/aar/jni -name 'libgojni.so' | head -n1)
          echo "extracted: $SO"
          LINE=$(tr '\0' '\n' < "$SO" | grep -a '^dep' | grep -a 'xtls/xray-core' | head -n1)
          echo "buildinfo line: $LINE"
          MODVER=$(echo "$LINE" | grep -aoE 'v[0-9]+(\.[0-9]+)+' | head -n1)
          echo "module version: $MODVER"
          if [ -n "$MODVER" ]; then
            RAW=$(echo "$MODVER" | sed -E 's/^v[0-9]+\.//')
            MAJ=$(echo "$RAW" | cut -d. -f1 | cut -c1-2)
            MM=$(echo "$RAW" | cut -d. -f1 | cut -c3-4)
            DD=$(echo "$RAW" | cut -d. -f1 | cut -c5-6)
            PATCH=$(echo "$RAW" | cut -d. -f2)
            VER="v${MAJ}.${MM}.${DD} (patch ${PATCH})"
          else
            VER="unknown"
          fi
          echo "REAL_XRAY=$VER"
          echo "real_xray=$VER" >> "$GITHUB_OUTPUT"
          echo "The APK will actually contain Xray core: $VER"

      - name: Set version
        run: |
          APP_VER="${{ github.event.inputs.app_version }}"
          # Compute versionCode: major*10000 + minor*100
          MAJOR=$(echo "$APP_VER" | cut -d. -f1)
          MINOR=$(echo "$APP_VER" | cut -d. -f2)
          CODE=$((MAJOR * 10000 + MINOR * 100))
          sed -i "s/versionCode = .*/versionCode = $CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$APP_VER\"/" app/build.gradle.kts
          echo "APP v${APP_VER} (versionCode=$CODE)"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="LionRayVPN-v${{ github.event.inputs.app_version }}-core${{ github.event.inputs.xray_version }}.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias lionray \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"
          echo "SIGNED: $SIGNED"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # libv2ray.aar is gitignored (downloaded fresh each run), so only the
          # version bump in build.gradle.kts is committed back to main.
          git add app/build.gradle.kts
          git commit -m "APP v${{ github.event.inputs.app_version }} | Xray v${{ github.event.inputs.xray_version }}" || true
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.event.inputs.app_version }}-core${{ github.event.inputs.xray_version }}
          name: "LionRay VPN v${{ github.event.inputs.app_version }} (Xray ${{ steps.corever.outputs.real_xray }})"
          body: |
            APP Version: ${{ github.event.inputs.app_version }}
            AAR Tag: ${{ github.event.inputs.xray_version }}
            Real Xray Core in this APK: ${{ steps.corever.outputs.real_xray }}

            > Note: the 2dust release tag may differ from the real core version
            > compiled into the binary. The value above is scanned directly from
            > libgojni.so and is the honest version this APK actually contains.

            Install: Download the APK and open it.
          files: LionRayVPN-v${{ github.event.inputs.app_version }}-core${{ github.event.inputs.xray_version }}.apk
          make_latest: true
